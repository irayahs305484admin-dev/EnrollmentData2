<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrollment Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Include Chart.js for data visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Loading spinner animation */
    .loader {
      border-top-color: #3b82f6;
      animation: spinner 1s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* Simple table styling for merged-like appearance */
    tr:nth-child(even) { background-color: #f9fafb; }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen">
  <div id="app" class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
    
    <!-- Loading Screen -->
    <div id="loading" class="flex flex-col items-center justify-center min-h-[60vh]">
      <div class="loader rounded-full border-4 border-t-4 border-gray-200 h-16 w-16 mb-4"></div>
      <h2 class="text-xl font-bold text-gray-700" id="loading-text">Connecting to Firebase...</h2>
      <p class="text-gray-500 mt-2" id="loading-subtext">Initializing database connection</p>
    </div>

    <!-- Error/Setup Screen -->
    <div id="setup-screen" class="hidden flex flex-col items-center justify-center min-h-[60vh]">
      <div class="bg-white p-8 rounded-xl shadow-md max-w-lg w-full text-center border border-gray-200">
        <h2 class="text-2xl font-bold text-gray-800 mb-4" id="setup-title">No Data Found</h2>
        <p class="text-gray-600 mb-6" id="setup-message">Your Firestore database is connected, but the "enrollment_data" collection is empty.</p>
        <button id="seed-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors w-full">
          Generate Sample Data
        </button>
      </div>
    </div>

    <!-- Main Content Area (Hidden initially) -->
    <div id="content" class="hidden">
      <header class="mb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold text-center text-blue-900 mb-6 drop-shadow-sm">
          Enrollment Dashboard
        </h1>
        
        <!-- Navigation Buttons -->
        <div id="tabs" class="flex flex-wrap justify-center gap-3">
          <!-- Buttons will be injected here via JavaScript -->
        </div>
      </header>

      <!-- Sheet Data Container -->
      <main id="sheet-content" class="bg-white shadow-xl rounded-xl p-6 md:p-8">
        <!-- Table and Charts will be injected here -->
      </main>
    </div>
  </div>

  <script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCLHq70jY6Nd5ZEKo4tIcQmJnlcrzpFk80",
      authDomain: "enrollment2-e44f6.firebaseapp.com",
      projectId: "enrollment2-e44f6",
      storageBucket: "enrollment2-e44f6.firebasestorage.app",
      messagingSenderId: "608494168365",
      appId: "1:608494168365:web:3a438360e3213735cc0ba4"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Global variables for dashboard state
    window.dashboardData = [];
    window.activeSheetIndex = 0;
    let chartInstances = []; // Keep track of charts to destroy them on re-render

    // Main initialization function
    async function initApp() {
      try {
        updateLoadingState("Authenticating...", "Connecting securely to Firestore");
        await signInAnonymously(auth);
        
        updateLoadingState("Fetching Data...", "Retrieving dashboard data from Firestore");
        await loadDashboardData();
        
      } catch (error) {
        showError("Firebase Connection Error", error.message);
      }
    }

    // Load data from Firestore
    async function loadDashboardData() {
      try {
        const querySnapshot = await getDocs(collection(db, "enrollment_data"));
        
        if (querySnapshot.empty) {
          showSetupScreen();
          return;
        }

        window.dashboardData = [];
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          window.dashboardData.push({
            id: doc.id,
            name: data.name || doc.id,
            values: data.values || [],
            order: data.order || 0
          });
        });

        // Sort tabs by the 'order' field
        window.dashboardData.sort((a, b) => a.order - b.order);

        renderDashboard();
      } catch (error) {
        showError("Error loading data", error.message + " (Check your Firestore security rules)");
      }
    }

    // Render the main dashboard UI
    function renderDashboard() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
      
      renderTabs();
      renderSheet(window.activeSheetIndex);
    }

    // Render navigation tabs
    function renderTabs() {
      const tabsContainer = document.getElementById('tabs');
      tabsContainer.innerHTML = '';
      
      window.dashboardData.forEach((sheet, index) => {
        const btn = document.createElement('button');
        btn.innerText = sheet.name;
        
        if (index === window.activeSheetIndex) {
          btn.className = 'px-5 py-2.5 rounded-lg font-semibold text-white bg-blue-600 shadow-md transform scale-105 transition-all';
        } else {
          btn.className = 'px-5 py-2.5 rounded-lg font-medium text-gray-700 bg-gray-200 hover:bg-gray-300 transition-all';
        }
        
        btn.onclick = () => {
          window.activeSheetIndex = index;
          renderTabs(); 
          renderSheet(index);
        };
        tabsContainer.appendChild(btn);
      });
    }

    // Render table and charts for the active sheet
    function renderSheet(index) {
      const sheet = window.dashboardData[index];
      const container = document.getElementById('sheet-content');
      
      // Cleanup previous charts to prevent memory leaks
      chartInstances.forEach(chart => chart.destroy());
      chartInstances = [];

      container.innerHTML = `<h2 class="text-2xl font-bold mb-6 text-gray-800 border-b-2 border-gray-100 pb-3">${sheet.name} Data</h2>`;

      // 1. Render Table
      if (sheet.values && sheet.values.length > 0) {
        const tableWrapper = document.createElement('div');
        tableWrapper.className = 'overflow-x-auto w-full mb-10 shadow-sm rounded-lg border border-gray-200';

        const table = document.createElement('table');
        table.className = 'w-full text-xs sm:text-sm text-left';

        let isFirstRow = true;

        sheet.values.forEach((row) => {
          if (row.every(cell => !cell || !cell.toString().trim())) return;

          const tr = document.createElement('tr');
          
          row.forEach(cell => {
            const cellTag = isFirstRow ? 'th' : 'td'; 
            const cellEl = document.createElement(cellTag);
            
            cellEl.innerText = cell;
            
            if (isFirstRow) {
              cellEl.className = 'px-2 py-2 sm:px-4 sm:py-3 bg-blue-50 text-blue-900 font-bold border-b border-gray-200 uppercase tracking-wider text-center break-words';
            } else {
              cellEl.className = 'px-2 py-2 sm:px-4 sm:py-3 border-b border-gray-100 text-center font-medium break-words whitespace-normal';
            }
            
            if (cell && cell.toString().toLowerCase() === 'total') {
              cellEl.classList.add('font-bold', 'text-blue-700');
            }

            tr.appendChild(cellEl);
          });
          
          table.appendChild(tr);
          isFirstRow = false; 
        });

        tableWrapper.appendChild(table);
        container.appendChild(tableWrapper);
        
        // 2. Generate dynamic charts based on tabular data
        generateChartsFromData(sheet, container);
        
      } else {
        container.innerHTML += `<p class="text-gray-500 italic mb-6">No tabular data found in this sheet.</p>`;
      }
    }

    // Automatically generates simple charts by analyzing the table structure
    function generateChartsFromData(sheet, container) {
      if (!sheet.values || sheet.values.length < 2) return;
      
      const headers = sheet.values[0];
      const rows = sheet.values.slice(1);
      
      // Filter out 'Total' rows for charting
      const dataRows = rows.filter(row => row[0] && row[0].toString().toLowerCase() !== 'total');
      
      if (dataRows.length === 0 || headers.length < 2) return;

      const chartsTitle = document.createElement('h3');
      chartsTitle.className = 'text-2xl font-bold mb-6 mt-10 text-gray-800 border-b-2 border-gray-100 pb-2';
      chartsTitle.innerText = 'Visualizations';
      container.appendChild(chartsTitle);

      const chartsContainer = document.createElement('div');
      chartsContainer.className = 'grid grid-cols-1 lg:grid-cols-2 gap-8 mt-6 items-center w-full';

      // Assume Column 0 is Labels (e.g., "Grade 7", "Section A")
      const labels = dataRows.map(row => row[0]);

      // Create a chart for each numeric column
      for (let i = 1; i < headers.length; i++) {
        // Skip total columns to prevent skewed charts
        if (headers[i].toLowerCase() === 'total') continue;
        
        // Parse data, default to 0 if not a valid number
        const dataset = dataRows.map(row => parseFloat(row[i]) || 0);

        const chartWrapper = document.createElement('div');
        chartWrapper.className = 'w-full p-4 bg-white rounded-xl shadow-md border border-gray-200';
        
        const canvas = document.createElement('canvas');
        chartWrapper.appendChild(canvas);
        chartsContainer.appendChild(chartWrapper);

        // Define colors based on column index for variety
        const colors = [
          'rgba(59, 130, 246, 0.7)', // Blue
          'rgba(16, 185, 129, 0.7)', // Green
          'rgba(245, 158, 11, 0.7)', // Yellow
          'rgba(239, 68, 68, 0.7)'   // Red
        ];
        const borderColor = [
          'rgb(59, 130, 246)',
          'rgb(16, 185, 129)',
          'rgb(245, 158, 11)',
          'rgb(239, 68, 68)'
        ];

        const colorIndex = (i - 1) % colors.length;

        const chart = new Chart(canvas, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: headers[i],
              data: dataset,
              backgroundColor: colors[colorIndex],
              borderColor: borderColor[colorIndex],
              borderWidth: 1,
              borderRadius: 4
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'top' },
              title: { display: true, text: `${headers[i]} Distribution` }
            },
            scales: {
              y: { beginAtZero: true }
            }
          }
        });
        chartInstances.push(chart);
      }
      container.appendChild(chartsContainer);
    }


    // --- UTILITY & SETUP FUNCTIONS ---

    function updateLoadingState(title, subtext) {
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('loading-text').innerText = title;
      document.getElementById('loading-subtext').innerText = subtext;
    }

    function showSetupScreen() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('setup-screen').classList.remove('hidden');
    }

    function showError(title, message) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('setup-screen').classList.add('hidden');
      
      const appDiv = document.getElementById('app');
      const errorHtml = `
        <div class="bg-red-50 border-l-4 border-red-500 p-6 rounded-lg shadow-sm max-w-2xl mx-auto mt-10">
          <div class="flex items-center">
            <svg class="h-6 w-6 text-red-500 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <h3 class="text-lg font-bold text-red-800">${title}</h3>
          </div>
          <p class="text-red-700 mt-2 font-mono text-sm">${message}</p>
          <p class="text-red-600 mt-4 text-sm font-semibold">Ensure your Firestore Security Rules allow read/write access for anonymous users during setup.</p>
        </div>
      `;
      appDiv.insertAdjacentHTML('afterbegin', errorHtml);
    }

    // Seed dummy data into Firestore
    document.getElementById('seed-btn').addEventListener('click', async () => {
      const btn = document.getElementById('seed-btn');
      btn.innerText = "Writing to database...";
      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-not-allowed');

      const sampleData = [
        {
          id: "overall_enrollment",
          name: "Overall Enrollment",
          order: 1,
          values: [
            ["Grade Level", "Male", "Female", "Total"],
            ["Grade 7", "120", "135", "255"],
            ["Grade 8", "115", "140", "255"],
            ["Grade 9", "130", "125", "255"],
            ["Grade 10", "110", "115", "225"],
            ["Total", "475", "515", "990"]
          ]
        },
        {
          id: "strand_breakdown",
          name: "SHS Strands",
          order: 2,
          values: [
            ["Strand", "Students", "Target Quota"],
            ["STEM", "150", "200"],
            ["ABM", "120", "150"],
            ["HUMSS", "180", "150"],
            ["GAS", "90", "100"],
            ["Total", "540", "600"]
          ]
        }
      ];

      try {
        for (const sheet of sampleData) {
          await setDoc(doc(db, "enrollment_data", sheet.id), {
            name: sheet.name,
            order: sheet.order,
            values: sheet.values
          });
        }
        
        btn.innerText = "Success! Reloading...";
        setTimeout(() => {
          loadDashboardData();
        }, 1000);
      } catch (error) {
        showError("Failed to seed database", error.message);
        btn.innerText = "Generate Sample Data";
        btn.disabled = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
      }
    });

    // Start App on load
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
