<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrollment Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Loading spinner animation */
    .loader {
      border-top-color: #3b82f6;
      animation: spinner 1s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* Simple table styling for merged-like appearance */
    tr:nth-child(even) { background-color: #f9fafb; }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen">
  <div id="app" class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
    
    <!-- Loading Screen -->
    <div id="loading" class="flex flex-col items-center justify-center min-h-[60vh]">
      <div class="loader rounded-full border-4 border-t-4 border-gray-200 h-16 w-16 mb-4"></div>
      <h2 class="text-xl font-bold text-gray-700">Loading Dashboard...</h2>
      <p id="loading-text" class="text-gray-500 mt-2">Fetching data...</p>
    </div>

    <!-- Main Content Area (Hidden initially) -->
    <div id="content" class="hidden">
      <header class="mb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold text-center text-blue-900 mb-6 drop-shadow-sm">
          Enrollment Dashboard
        </h1>
        
        <!-- Navigation Buttons -->
        <div id="tabs" class="flex flex-wrap justify-center gap-3">
          <!-- Buttons will be injected here via JavaScript -->
        </div>
      </header>

      <!-- Sheet Data Container -->
      <main id="sheet-content" class="bg-white shadow-xl rounded-xl p-6 md:p-8">
        <!-- Table and Charts will be injected here -->
      </main>
    </div>
  </div>

  <!-- Use type="module" to import modern Firebase Web SDKs via CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    // Your provided Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCLHq70jY6Nd5ZEKo4tIcQmJnlcrzpFk80",
      authDomain: "enrollment2-e44f6.firebaseapp.com",
      projectId: "enrollment2-e44f6",
      storageBucket: "enrollment2-e44f6.firebasestorage.app",
      messagingSenderId: "608494168365",
      appId: "1:608494168365:web:3a438360e3213735cc0ba4"
    };

    // Initialize Firebase and Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let dashboardData = [];
    let activeSheetIndex = 0;

    // Initialize the app when the window loads
    window.onload = async function() {
      const loadingText = document.getElementById('loading-text');

      // 1. Check if running inside Google Apps Script deployment
      if (typeof google !== 'undefined' && google.script) {
        loadingText.innerText = "Fetching data via Google Apps Script...";
        
        google.script.run
          .withSuccessHandler(async function(data) {
            dashboardData = data;
            initDashboard();
            
            // Backup/Sync this fresh data to Firestore
            try {
              await setDoc(doc(db, "enrollment_data", "dashboard"), { sheets: data });
              console.log("Data successfully synced to Firestore.");
            } catch (error) {
              console.warn("Could not sync to Firestore (check database rules):", error);
            }
          })
          .withFailureHandler(async function(error) {
             console.warn("GAS fetch failed, falling back to Firestore...", error);
             await loadFromFirestore();
          })
          .getDashboardData();
      } 
      // 2. If not in GAS (e.g., deployed to Firebase Hosting), use Firestore / Direct Fetch
      else {
        loadingText.innerText = "Connecting to Firebase Database...";
        await loadFromFirestore();
      }
    };

    // Function to load data directly from Firestore
    async function loadFromFirestore() {
      try {
        const docRef = doc(db, "enrollment_data", "dashboard");
        const docSnap = await getDoc(docRef);
        
        if (docSnap.exists()) {
          console.log("Data loaded from Firestore.");
          dashboardData = docSnap.data().sheets;
          initDashboard();
        } else {
          console.log("No data in Firestore. Fetching directly from Google Sheet link...");
          await loadFromGoogleSheetURL();
        }
      } catch (e) {
        console.warn("Failed to load from Firestore. Attempting direct Sheet fetch...", e);
        await loadFromGoogleSheetURL();
      }
    }

    // Function to fetch directly from the provided Google Sheet link (Failsafe mode)
    async function loadFromGoogleSheetURL() {
      document.getElementById('loading-text').innerText = "Fetching directly from Google Sheets API...";
      try {
        const sheetId = '1fy-YIJ0JqkdLxsl8ZHsHjEsXbYlpSbHng0j_1vt-jR4';
        const gid = '1217663629';
        // Using the Google Visualization endpoint for direct JSON access
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gid}`;
        
        const response = await fetch(url);
        let text = await response.text();
        
        // Extract JSON from Google's response wrapper
        const start = text.indexOf('{');
        const end = text.lastIndexOf('}');
        if (start === -1 || end === -1) throw new Error("Invalid response format from Google Sheets");
        
        text = text.substring(start, end + 1);
        const json = JSON.parse(text);
        
        const values = [];
        // Map headers
        const headers = json.table.cols.map(col => col.label || "");
        values.push(headers);
        
        // Map rows
        json.table.rows.forEach(row => {
          const rowData = row.c.map(cell => cell ? (cell.f || cell.v || "") : "");
          values.push(rowData);
        });
        
        dashboardData = [{
          name: "Enrollment Data (Direct)",
          values: values,
          charts: [] // Direct client-side fetch doesn't export chart images
        }];
        
        initDashboard();
        
        // Save this to Firestore for faster loads next time
        try {
          await setDoc(doc(db, "enrollment_data", "dashboard"), { sheets: dashboardData });
        } catch (dbError) {
          console.warn("Skipped Firestore saving:", dbError);
        }

      } catch(e) {
         document.getElementById('loading').innerHTML = `
          <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded max-w-lg mx-auto shadow">
            <div class="flex">
              <div class="ml-3">
                <p class="text-sm text-red-700 font-bold">Failed to load from all sources.</p>
                <p class="text-sm text-red-600 mt-1">${e.message}</p>
              </div>
            </div>
          </div>`;
      }
    }

    function initDashboard() {
      if (!dashboardData || dashboardData.length === 0) {
        document.getElementById('loading').innerHTML = `<p class="text-gray-500 font-medium">No data found in the database or spreadsheet.</p>`;
        return;
      }
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').classList.remove('hidden');
      renderTabs();
      renderSheet(0);
    }

    function renderTabs() {
      const tabsContainer = document.getElementById('tabs');
      tabsContainer.innerHTML = '';
      
      dashboardData.forEach((sheet, index) => {
        const btn = document.createElement('button');
        btn.innerText = sheet.name;
        
        if (index === activeSheetIndex) {
          btn.className = 'px-5 py-2.5 rounded-lg font-semibold text-white bg-blue-600 shadow-md transform scale-105 transition-all';
        } else {
          btn.className = 'px-5 py-2.5 rounded-lg font-medium text-gray-700 bg-gray-200 hover:bg-gray-300 transition-all';
        }
        
        btn.onclick = () => {
          activeSheetIndex = index;
          renderTabs(); 
          renderSheet(index);
        };
        tabsContainer.appendChild(btn);
      });
    }

    function renderSheet(index) {
      const sheet = dashboardData[index];
      const container = document.getElementById('sheet-content');
      container.innerHTML = `<h2 class="text-2xl font-bold mb-6 text-gray-800 border-b-2 border-gray-100 pb-3">${sheet.name}</h2>`;

      // 1. Render Table
      if (sheet.values && sheet.values.length > 0) {
        const tableWrapper = document.createElement('div');
        tableWrapper.className = 'overflow-x-auto w-full mb-10 shadow-sm rounded-lg border border-gray-200';

        const table = document.createElement('table');
        table.className = 'w-full text-xs sm:text-sm text-left';

        let isFirstRow = true;

        sheet.values.forEach((row, rowIndex) => {
          if (row.every(cell => !cell.toString().trim())) return;

          const tr = document.createElement('tr');
          
          row.forEach(cell => {
            const cellTag = isFirstRow ? 'th' : 'td'; 
            const cellEl = document.createElement(cellTag);
            cellEl.innerText = cell;
            
            if (isFirstRow) {
              cellEl.className = 'px-2 py-2 sm:px-4 sm:py-3 bg-blue-50 text-blue-900 font-bold border-b border-gray-200 uppercase tracking-wider text-center break-words';
            } else {
              cellEl.className = 'px-2 py-2 sm:px-4 sm:py-3 border-b border-gray-100 text-center font-medium break-words whitespace-normal';
            }
            
            if (cell.toString().toLowerCase() === 'total') {
              cellEl.classList.add('font-bold', 'text-blue-700');
            }

            tr.appendChild(cellEl);
          });
          
          table.appendChild(tr);
          isFirstRow = false; 
        });

        tableWrapper.appendChild(table);
        container.appendChild(tableWrapper);
      } else {
        container.innerHTML += `<p class="text-gray-500 italic mb-6">No tabular data found in this sheet.</p>`;
      }

      // 2. Render Charts 
      if (sheet.charts && sheet.charts.length > 0) {
        const chartsTitle = document.createElement('h3');
        chartsTitle.className = 'text-2xl font-bold mb-6 mt-10 text-gray-800 border-b-2 border-gray-100 pb-2';
        chartsTitle.innerText = 'Visualizations';
        container.appendChild(chartsTitle);

        const chartsContainer = document.createElement('div');
        chartsContainer.className = 'flex flex-col gap-10 mt-6 items-center w-full';

        sheet.charts.forEach(chartBase64 => {
          const imgWrapper = document.createElement('div');
          imgWrapper.className = 'w-full flex justify-center p-4 bg-white rounded-xl shadow-md border border-gray-200 hover:shadow-xl transition-shadow';
          
          const img = document.createElement('img');
          img.src = chartBase64;
          img.className = 'w-full max-w-5xl h-auto rounded-lg object-contain';
          img.alt = `Chart for ${sheet.name}`;
          
          imgWrapper.appendChild(img);
          chartsContainer.appendChild(imgWrapper);
        });

        container.appendChild(chartsContainer);
      }
    }
  </script>
</body>
</html>
